<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naima Xusanova · Bilimni mustahkamlash</title>
<meta name="description" content="Naima Xusanova: 1-4-sinf o‘quvchilari uchun darslik mavzulari bo‘yicha mashq, takrorlash, aralash blok, tezkor hisob va duel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: katak daftar varag'i — chap tomonda qizil hoshiya chizig'i, yuqorida sinf tanlovchi; duel bo'limi yashil sinf doskasi */
:root{
  --paper:#F3F6FB; --sheet:#FFFFFF; --grid:#DFE7F2; --line:#CBD6E5;
  --ink:#1B2540; --ink-2:#56607A; --ink-3:#8590A8;
  --margin:#E2574C; --sun:#F2B630; --sun-soft:#FDF1D3;
  --g1:#E0674F; --g2:#D8981F; --g3:#2F8F62; --g4:#3A72C2;
  --g1-soft:#FBE6E1; --g2-soft:#FBEFD6; --g3-soft:#DFF1E7; --g4-soft:#E1EBF8;
  --ok:#22884F; --ok-soft:#DDF3E5; --bad:#C9402F; --bad-soft:#FBE3DF;
  --board:#1F4A3C; --board-2:#26584A; --board-ink:#EEF4EC; --chalk:#F6E7A8;
  --btn:#1B2540; --btn-ink:#FFFFFF;
  --shadow:0 1px 0 rgba(27,37,64,.06),0 6px 18px -10px rgba(27,37,64,.25);
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111726; --sheet:#182033; --grid:#1B2438; --line:#2B3751;
  --ink:#E9EEF8; --ink-2:#A3AEC5; --ink-3:#77839C;
  --margin:#E66A5F; --sun:#F2BE45; --sun-soft:#3A3120;
  --g1:#F08A73; --g2:#EDB34A; --g3:#5CC08F; --g4:#73A2E6;
  --g1-soft:#3A2420; --g2-soft:#3A2F1A; --g3-soft:#18352A; --g4-soft:#1B2C47;
  --ok:#55C487; --ok-soft:#163626; --bad:#F07A6A; --bad-soft:#3D1F1B;
  --board:#14352B; --board-2:#1B4337; --board-ink:#E8F0E6; --chalk:#F2E19B;
  --btn:#E9EEF8; --btn-ink:#111726;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111726; --sheet:#182033; --grid:#1B2438; --line:#2B3751;
  --ink:#E9EEF8; --ink-2:#A3AEC5; --ink-3:#77839C;
  --margin:#E66A5F; --sun:#F2BE45; --sun-soft:#3A3120;
  --g1:#F08A73; --g2:#EDB34A; --g3:#5CC08F; --g4:#73A2E6;
  --g1-soft:#3A2420; --g2-soft:#3A2F1A; --g3-soft:#18352A; --g4-soft:#1B2C47;
  --ok:#55C487; --ok-soft:#163626; --bad:#F07A6A; --bad-soft:#3D1F1B;
  --board:#14352B; --board-2:#1B4337; --board-ink:#E8F0E6; --chalk:#F2E19B;
  --btn:#E9EEF8; --btn-ink:#111726;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sheet)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g4);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.mark{width:40px;height:40px;border-radius:10px;background:var(--sheet);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;position:relative;flex:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px}
.mark::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--margin)}
.brand b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--ink-2);font-size:12px}
.grades{display:flex;gap:6px;margin-left:auto}
.gchip{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-weight:700;font-family:var(--f-display);font-size:15px;color:var(--ink-2)}
.gchip[aria-pressed="true"]{color:#fff;border-color:transparent}
.gchip[data-g="1"][aria-pressed="true"]{background:var(--g1)}
.gchip[data-g="2"][aria-pressed="true"]{background:var(--g2)}
.gchip[data-g="3"][aria-pressed="true"]{background:var(--g3)}
.gchip[data-g="4"][aria-pressed="true"]{background:var(--g4)}
nav.tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-11px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px 11px;border-bottom:3px solid transparent;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--margin)}

/* Page */
main{max-width:1180px;margin:0 auto;padding-block:22px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.ruled{position:relative;padding:20px 20px 20px 34px}
.ruled::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2A2108}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--paper)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.in{width:100%;border:2px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 11px;color:var(--ink);font-weight:500}
.in:focus{border-color:var(--g4);outline:none}
textarea.in{resize:vertical;min-height:90px;line-height:1.45}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.badge.g1{background:var(--g1-soft);color:var(--g1);border-color:transparent}
.badge.g2{background:var(--g2-soft);color:var(--g2);border-color:transparent}
.badge.g3{background:var(--g3-soft);color:var(--g3);border-color:transparent}
.badge.g4{background:var(--g4-soft);color:var(--g4);border-color:transparent}
.badge.sample{background:var(--sun-soft);color:var(--g2);border-color:transparent}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:2px dashed var(--line);border-radius:var(--r);background:var(--sheet)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--margin)}
.hero p{max-width:56ch}
.stat-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700}
.stat span{font-size:13px;color:var(--ink-2)}
.gradepick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{border:0;border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px;position:relative;overflow:hidden;color:var(--ink)}
.gcard b{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700}
.gcard span{font-size:13px;color:var(--ink-2);font-weight:600}
.gcard[data-g="1"]{background:var(--g1-soft)} .gcard[data-g="1"] b{color:var(--g1)}
.gcard[data-g="2"]{background:var(--g2-soft)} .gcard[data-g="2"] b{color:var(--g2)}
.gcard[data-g="3"]{background:var(--g3-soft)} .gcard[data-g="3"] b{color:var(--g3)}
.gcard[data-g="4"]{background:var(--g4-soft)} .gcard[data-g="4"] b{color:var(--g4)}
.gcard[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:-3px}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.subj{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.subj .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--paper);border:1px solid var(--line)}
.subj b{font-weight:700}
.subj small{color:var(--ink-2)}
.subj:hover{border-color:var(--ink-3)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;padding:18px}
.mode h3{font-size:20px}

/* Lessons */
.lesson{display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px 30px;position:relative}
.lesson::before{content:"";position:absolute;left:16px;top:12px;bottom:12px;width:2px;background:var(--margin);opacity:.6}
.lesson .ln{font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:14px}
.lesson h3{font-size:18px}
.lesson p{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson .acts{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.meter{height:6px;border-radius:9px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

/* Quiz */
.quiz{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--sheet)}
.dots i.cur{border-color:var(--ink)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
.qcard{padding:26px 24px 24px 40px}
.qtext{font-family:var(--f-display);font-size:clamp(22px,3.4vw,32px);font-weight:600;line-height:1.25;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px 16px;text-align:left;font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center;min-height:60px}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-family:var(--f-display);font-size:15px;flex:none}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ansrow{display:flex;gap:10px;flex-wrap:wrap}
.ansrow .in{flex:1 1 200px;font-size:20px;padding:12px 14px;font-weight:600}
.feedback{border-radius:12px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback p{margin:2px 0 0;color:var(--ink);font-weight:500}
.stars{font-family:var(--f-display);font-weight:700;color:var(--g2);background:var(--sun-soft);border-radius:999px;padding:4px 12px}
.result{text-align:center;padding:30px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.score-big{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1}
.mistakes{text-align:left;width:100%;max-width:620px;display:flex;flex-direction:column;gap:8px}
.mistake{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.mistake b{display:block}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* Review */
.lessonpick{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet)}
.pick input{width:18px;height:18px;accent-color:var(--g3)}
.pick span{flex:1;min-width:0}
.pick small{color:var(--ink-3)}

/* Duel — sinf doskasi */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:20px;border:10px solid #8A5A35;box-shadow:inset 0 0 40px rgba(0,0,0,.25),var(--shadow)}
.board h2,.board h3{color:var(--board-ink)}
.board .muted{color:color-mix(in srgb,var(--board-ink) 70%,transparent)}
.track{display:flex;flex-direction:column;gap:10px;margin:12px 0 18px}
.lane{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center}
.lane b{font-family:var(--f-display);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road{height:22px;border-radius:999px;background:var(--board-2);position:relative;border:1px dashed color-mix(in srgb,var(--board-ink) 35%,transparent)}
.road i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .4s;min-width:22px}
.players{display:grid;gap:14px}
.pbox{border-radius:14px;padding:14px;background:var(--board-2);border:2px solid transparent;display:flex;flex-direction:column;gap:10px;min-width:0}
.pbox .pq{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--chalk);min-height:56px}
.pbox .opt{background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 30%,transparent);font-size:17px;min-height:50px;padding:10px 12px}
.pbox .opt .k{background:transparent;border-color:color-mix(in srgb,var(--board-ink) 30%,transparent);color:var(--board-ink)}
.pbox .opt.ok{background:rgba(85,196,135,.25);border-color:#55C487}
.pbox .opt.no{background:rgba(240,122,106,.25);border-color:#F07A6A}
.pbox .in{background:transparent;color:var(--board-ink);border-color:color-mix(in srgb,var(--board-ink) 30%,transparent)}
.pc1{--pc:#F07A6A} .pc2{--pc:#73A2E6} .pc3{--pc:#F2CF5B}
.duel-arena{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#v-duel:fullscreen{background:var(--board);overflow:auto;padding:12px}
#v-duel:fullscreen .board{min-height:calc(100vh - 24px);box-sizing:border-box}
.adisp{min-height:52px;border-radius:12px;border:2px solid var(--pc);background:rgba(0,0,0,.18);display:flex;align-items:center;padding:6px 14px;font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--board-ink);letter-spacing:.02em;overflow:hidden;word-break:break-all}
.adisp .ph{font-size:15px;font-weight:500;opacity:.55;letter-spacing:0}
.adisp.ok{border-color:#55C487;background:rgba(85,196,135,.25)} .adisp.no{border-color:#F07A6A;background:rgba(240,122,106,.25)}
.kpad{display:grid;gap:6px;touch-action:manipulation}
.kpad.knum{grid-template-columns:repeat(3,1fr)} .kpad.kabc{grid-template-columns:repeat(6,1fr)}
.kk{min-height:52px;border-radius:10px;border:1px solid color-mix(in srgb,var(--board-ink) 28%,transparent);background:rgba(255,255,255,.07);color:var(--board-ink);font-family:var(--f-display);font-size:22px;font-weight:600;cursor:pointer;touch-action:manipulation;padding:0}
.kabc .kk{min-height:44px;font-size:19px}
.kk.down,.kk:active{background:var(--pc);color:#1B2540;transform:scale(.96)}
.kk.kok{background:var(--pc);color:#1B2540} .kabc .kok{grid-column:span 2} .kabc .kdel{grid-column:span 2}
.kk.kdel{background:rgba(0,0,0,.2)}
.pbox .opt{touch-action:manipulation}
.dhint{font-size:13px;margin:14px 0 0}
@media (max-width:760px){ .players{grid-template-columns:1fr!important} }
.pbox{border-color:var(--pc)}
.pbox .pn{font-weight:700;color:var(--pc);display:flex;justify-content:space-between}
.road i.pc1,.road i.pc2,.road i.pc3{background:var(--pc)}
.winner{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.winner .crown{font-family:var(--f-display);font-size:54px;color:var(--chalk);font-weight:700;line-height:1.05}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

/* Books / reader */
.book{display:flex;gap:14px;padding:14px;align-items:flex-start}
.spine{width:54px;height:72px;border-radius:4px 8px 8px 4px;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:22px;box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.spine.g1{background:var(--g1)}.spine.g2{background:var(--g2)}.spine.g3{background:var(--g3)}.spine.g4{background:var(--g4)}
.book .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.book h3{font-size:17px}
.reader{display:flex;flex-direction:column;gap:12px}
.reader-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.canvas-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.canvas-wrap canvas{max-width:100%;height:auto;background:#fff;box-shadow:var(--shadow);border-radius:4px}

/* Teacher */
.tlayout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.titem{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:2px}
.titem[aria-current="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--margin)}
.titem small{color:var(--ink-3)}
.form{display:flex;flex-direction:column;gap:14px;padding:18px}
.fgrid{display:grid;grid-template-columns:110px 1fr 100px;gap:10px}
.qedit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.qedit .qtop{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.optedit{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:center}
.optedit input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.ai{border:2px dashed var(--g4);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--g4-soft)}
.ai h3{font-size:18px;color:var(--g4)}
.status{font-size:13px;font-weight:600}
.status.err{color:var(--bad)} .status.ok{color:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}

/* Footer */
.foot{max-width:1180px;margin:10px auto 0;padding-block:18px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line)}
.foot b{font-family:var(--f-display);color:var(--ink);font-weight:600}
.sign{font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:13px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-weight:600;z-index:90;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .tlayout{grid-template-columns:1fr}
  .tlist{max-height:260px}
}
@media (max-width:520px){
  .grades{margin-left:0}
  .fgrid{grid-template-columns:1fr 1fr}
  .fgrid label:nth-child(2){grid-column:1/-1}
  .lane{grid-template-columns:76px 1fr 30px}
  .qcard{padding:20px 16px 18px 30px}
  .ruled{padding:18px 16px 18px 30px}
  .ruled::before{left:14px}
  .board{border-width:6px;padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.opts .opt:nth-child(1) .k{background:var(--k1);color:#fff;border:0}

.qcard{border:0;box-shadow:0 14px 34px -18px rgba(60,60,160,.55)}

saxiy","explain":"Qarama-qarshi ma’noli so‘zlar."},{"type":"choice","q":"«Yaxshilik nur keltirar, yomonlik – ...» maqolini davom ettiring.","options":["zulmat","quvonch","baxt","oydinlik"],"answer":"zulmat","explain":"Nur — zulmat qarama-qarshi."}]},{"id":"ona3-d33","grade":3,"subject":"Ona tili","num":33,"title":"Leksikologiya: mustahkamlash","summary":"","ref":"Darslik, 77–79-betlar","questions":[{"answer":"yomg‘irli, seryomg‘ir, yomg‘irsiz","explain":"Darslikdagi namuna.","options":["yomg‘irli, seryomg‘ir, yomg‘irsiz","yomg‘ir, qor, do‘l","yomg‘irda, yomg‘irga, yomg‘irni","bulut, osmon, shamol"],"q":"«yomg‘ir» so‘ziga qaysi qatorda asosdosh so‘zlar berilgan?","type":"choice"},{"answer":"sutli","explain":"sut + li — so‘z yasovchi qo‘shimcha.","options":["sutli","sutga","sutni","sutda"],"q":"«sut» so‘zidan qaysi asosdosh so‘z yasaladi?","type":"choice"},{"answer":"beparvo","explain":"be + parvo.","options":["beparvo","parvoga","parvoni","parvoda"],"q":"«parvo» so‘zidan qaysi asosdosh so‘z yasaladi?","type":"choice"},{"answer":"kambag‘allik","explain":"Boylik — kambag‘allik.","options":["kambag‘allik","xazina","mol-mulk","boyish"],"q":"«Yer boyligi – el boyligi» maqolidagi «boylik» so‘zining antonimi qaysi?","type":"choice"},{"answer":"taassurot","explain":"«aa» — yonma-yon kelgan bir xil unlilar.","options":["taassurot","salqin","daraxt","kuz"],"q":"Qaysi so‘zda qo‘sh unli bor?","type":"choice"},{"answer":"undov belgisi","explain":"His-hayajon bilan aytilgan gap.","options":["undov belgisi","so‘roq belgisi","nuqta","vergul"],"q":"«Oltin kuz, sen haqiqatan ham sehrgarsan!» gapi oxiriga qaysi tinish belgisi qo‘yilgan?","type":"choice"},{"answer":"tap-tap","explain":"Tovushga taqlid so‘z.","options":["tap-tap","karvon","tagidan","etadi"],"q":"«Tap-tap etadi, tagidan karvon o‘tadi» topishmog‘idagi taqlid so‘z qaysi?","type":"choice"},{"type":"choice","q":"«xabar» so‘zidan asosdosh so‘z qaysi?","options":["xabarchi","xabarga","xabarni","xabarda"],"answer":"xabarchi","ex <script>
(() => {
"use strict";

/* ---------- Ma'lumotnoma ---------- */
const SUBJECTS = {
  1: ["Savod o‘rgatish","Matematika","Tabiiy fan","Tarbiya","Ingliz tili"],
  2: ["Ona tili","O‘qish","Matematika","Tabiiy fan","Tarbiya","Ingliz tili"],

};
const ALL_SUBJECTS = ["Savod o‘rgatish","Ona tili","O‘qish","Matematika","Tabiiy fan","Tarbiya","Ingliz tili","Rus tili","Texnologiya","Tasviriy san’at","Musiqa"];

const scv = s => `--sc:var(${SUBJ_COLOR[s]||"--s-other"})`;
const SUBJ_MARK = {"Savod o‘rgatish":"Aa","Ona tili":"Oʻ","O‘qish":"Kt","Matematika":"+−","Tabiiy fan":"Tf","Tarbiya":"Tr","Ingliz tili":"En","Rus tili":"Ру","Texnologiya":"Tx","Tasviriy san’at":"Ts","Musiqa":"Mu"};
const BLOCKED_WORDS = ["diniy","qur'on","qur’on","qurʼon","namoz","hadis","islom","tafsir","bibliya","injil","tavrot","duo kitob"];

/* ---------- Yordamchilar ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[‘’ʻʼ`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,;:]+$/,"").trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const LS = {

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function gClass(g){ return "g"+(g||3); }

/* ---------- Holat ---------- */
const S = {

};
let db = null, assets = null, sample = null, user = null;

/* ---------- Saqlash qatlami (db yoki shu brauzer) ---------- */
const local = {
  read(){ return LS.get("nx_local", {lessons:[], books:[]}); },
  write(d){ LS.set("nx_local", d); }
};
async function saveLesson(obj){
  obj.updatedAt = new Date().toISOString();
  if (db){ await db.collection("lessons").doc(obj.id).set(obj); }
  else { const d=local.read(); const i=d.lessons.findIndex(x=>x.id===obj.id); if(i>=0) d.lessons[i]=obj; else d.lessons.push(obj); local.write(d); S.lessons=d.lessons; renderAll(); }
}
async function deleteLesson(id){
  if (db){ await db.collection("lessons").doc(id).delete(); }
  else { const d=local.read(); d.lessons=d.lessons.filter(x=>x.id!==id); local.write(d); S.lessons=d.lessons; renderAll(); }
}
async function saveBook(obj){
  if (db){ await db.collection("books").doc(obj.id).set(obj); }
  else { const d=local.read(); d.books.push(obj); local.write(d); S.books=d.books; renderAll(); }
}
async function deleteBook(id){
  if (db){ await db.collection("books").doc(id).delete(); }
  else { const d=local.read(); d.books=d.books.filter(x=>x.id!==id); local.write(d); S.books=d.books; renderAll(); }
}
const localFiles = {}; // db yo'q rejimda yuklangan PDFlar (faqat shu sessiya)

/* ---------- Tanlovlar ---------- */
const lessonsOf = (g, subj) => S.lessons.filter(l => +l.grade===+g && (!subj || l.subject===subj)).sort((a,b)=>(a.subject||"").localeCompare(b.subject||"") || (+a.num||0)-(+b.num||0));
const booksOf = (g) => S.books.filter(b => +b.grade===+g);
function lessonScore(id){ const s=S.stats[id]; return s && s.total ? Math.round(s.right/s.total*100) : null; }
function recordAnswer(lessonId, ok){
  const s = S.stats[lessonId] || {right:0,total:0};
  s.total++; if(ok) s.right++; S.stats[lessonId]=s; LS.set("nx_stats", S.stats);
  if (ok){ S.stars++; LS.set("nx_stars", S.stars); }
}

/* ---------- Navigatsiya ---------- */
function go(view){
  S.view = view;
  $$(".view").forEach(v => v.hidden = v.id !== "v-"+view);
  $$(".tab").forEach(t => t.toggleAttribute("aria-current", t.dataset.view === view || (view==="quiz" && t.dataset.view==="lessons")));
  $$(".tab").forEach(t => { if (t.hasAttribute("aria-current")) t.setAttribute("aria-current","page"); });
  render(view);
  window.scrollTo({top:0});
}
function setGrade(g){
  S.grade = +g; LS.set("nx_grade", S.grade);
  if (S.subject && !SUBJECTS[S.grade].includes(S.subject)) S.subject = null;
  $$(".gchip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.g===S.grade)));
  if (S.view==="quiz") go("lessons"); else render(S.view);
}
function renderAll(){ render(S.view); }
function render(view){
  const f = {home:rHome, lessons:rLessons, quiz:rQuiz, review:rReview, mix:rMix, duel:rDuel, books:rBooks, teacher:rTeacher}[view];
  if (f) f();
}
function sign(){ return `<div class="sign">Muallif: Naima Xusanova</div>`; }

/* ================= BOSH SAHIFA ================= */

  $("#v-home").innerHTML = `

        <span class="eyebrow">${g}-sinf · bugungi dars</span>

        <div class="stat-row">
          <div class="stat"><b class="num">${L.length}</b><span>mavzu</span></div>
          <div class="stat"><b class="num">${qn}</b><span>savol</span></div>
          <div class="stat"><b class="num">${new Set(L.map(l=>l.subject)).size}</b><span>fan</span></div>
          <div class="stat"><b class="num">${S.stars}</b><span>yulduzcha shu qurilmada</span></div>
        </div>
        <div class="row" style="margin-top:4px">
          <button class="btn sun" type="button" id="hQuick" ${qn?"":"disabled"}>Kunlik takror · 10 savol</button>
          <button class="btn ghost" type="button" id="hDuel">Duelni boshlash</button>
        </div>
      </div>
      <div class="sheet" style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <span class="eyebrow">Sinfni tanlang</span>
        <div class="gradepick">
          ${[1,2,3,4].map(n=>`<button class="gcard" data-g="${n}" type="button" aria-pressed="${n===g}"><b>${n}</b><span>${n}-sinf · ${lessonsOf(n).length} mavzu</span></button>`).join("")}
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 style="font-size:22px">${g}-sinf fanlari</h2>
      <div class="subjgrid">${subjCards}</div>
    </div>
    <div class="modes">
      <div class="sheet mode"><span class="eyebrow">1 · Mavzu doirasida</span><h3>Mavzu mashqi</h3><p class="muted" style="margin:0">Bugun o‘tilgan bitta mavzu bo‘yicha savollar, har biriga izoh bilan. Xatolar oxirida qayta ishlanadi.</p><button class="btn ghost sm" style="align-self:flex-start;margin-top:auto" data-go="lessons" type="button">Mavzular ro‘yxati</button></div>
      <div class="sheet mode"><span class="eyebrow">2 · Bir necha mavzu</span><h3>Takrorlash</h3><p class="muted" style="margin:0">Tanlangan mavzulardan aralash savollar. “Qiyin mavzular” rejimi ko‘p xato qilinganlarni oldinga chiqaradi.</p><button class="btn ghost sm" style="align-self:flex-start;margin-top:auto" data-go="review" type="button">Takrorlashni sozlash</button></div>
      <div class="sheet mode"><span class="eyebrow">3 · Doskada</span><h3>Duel 2–3 o‘quvchi</h3><p class="muted" style="margin:0">Har bir o‘quvchi o‘z savoliga javob beradi. To‘g‘ri javob uni marraga yaqinlashtiradi.</p><button class="btn ghost sm" style="align-self:flex-start;margin-top:auto" data-go="duel" type="button">Duel sozlamalari</button></div>
      <div class="sheet mode"><span class="eyebrow">4 · Hamma fanlar</span><h3>Aralash va tezkor hisob</h3><p class="muted" style="margin:0">Ona tili, o‘qish, matematika va boshqa fanlardan aralash blok. Karra jadvali, qo‘shish-ayirish misollari har safar yangidan tuziladi.</p><button class="btn ghost sm" style="align-self:flex-start;margin-top:auto" data-go="mix" type="button">Aralash bo‘limi</button></div>
    </div>
    ${!L.length ? `<div class="empty"><h3>${g}-sinf mavzulari tez orada qo‘shiladi</h3><p>Hozircha 3-sinf uchun Ona tili, O‘qish, Matematika, Tabiiy fan va Tarbiya mavzulari tayyor. “Aralash” bo‘limidagi tezkor hisob misollari esa barcha sinflar uchun ishlaydi.</p><div class="row" style="justify-content:center"><button class="btn" type="button" data-g3>3-sinfga o‘tish</button><button class="btn ghost" type="button" data-go="mix">Tezkor hisob</button></div></div>`:""}
    ${sign()}`;
  $$("#v-home .gcard").forEach(b => b.onclick = () => setGrade(b.dataset.g));
  $$("#v-home .subj").forEach(b => b.onclick = () => { S.subject = b.dataset.subj; go("lessons"); });
  $$("#v-home [data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const g3=$("#v-home [data-g3]"); if (g3) g3.onclick = () => setGrade(3);
  const q = $("#hQuick"); if (q) q.onclick = () => startReview({lessonIds: L.map(l=>l.id), count:10, weak:true, title:`${g}-sinf · kunlik takror`});

/* ================= MAVZULAR ================= */
function subjectChips(active, all=true){
  return `<div class="row" role="group" aria-label="Fan">${all?`<button class="chip" type="button" data-s="" aria-pressed="${!active}">Barchasi</button>`:""}${SUBJECTS[S.grade].map(s=>`<button class="chip" type="button" data-s="${esc(s)}" aria-pressed="${active===s}">${esc(s)}</button>`).join("")}</div>`;
}
function rLessons(){
  const L = lessonsOf(S.grade, S.subject);
  const cards = L.map(l => {
    const sc = lessonScore(l.id), n=(l.questions||[]).length;
    return `<article class="sheet lesson" style="${scv(l.subject)}">
      <div class="row" style="justify-content:space-between"><span class="ln">${esc(l.num? l.num+"-dars":"Mavzu")} · ${esc(l.subject)}</span>${l.sample?`<span class="badge sample">Namuna</span>`:""}</div>

      </div>
    </article>`;
  }).join("");
  $("#v-lessons").innerHTML = `
    <div class="row" style="justify-content:space-between"><div><span class="eyebrow">${S.grade}-sinf</span><h2 style="font-size:26px">Mavzu mashqi</h2></div><span class="stars num">★ ${S.stars}</span></div>
    ${subjectChips(S.subject)}
    ${L.length ? `<div class="grid g-auto">${cards}</div>` : `<div class="empty"><h3>${S.subject? esc(S.subject)+" fanidan":"Bu sinfda"} hali mavzu yo‘q</h3><p>Bu fan bo‘yicha mavzular tez orada qo‘shiladi.</p></div>`}
    ${sign()}`;
  $$("#v-lessons .chip").forEach(c => c.onclick = () => { S.subject = c.dataset.s || null; rLessons(); });

}


/* ================= YANGILIK: savollar takrorlanmasligi ================= */
/* Har bir savol shu qurilmada qachon chiqqani eslab qolinadi. Avval hali chiqmagan, keyin eng uzoq vaqt oldin chiqqan savollar beriladi. */
const SEEN = { m: LS.get("nx_seen", {}), t: LS.get("nx_tick", 0) };
const qKey = q => { let h=5381; const str=(q.lessonId||"")+"|"+q.q; for (let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); };
function markSeen(q){
  if (!q || q.gen) return;
  SEEN.t++; SEEN.m[qKey(q)] = SEEN.t;
  const keys = Object.keys(SEEN.m);
  if (keys.length > 4000){ keys.sort((a,b)=>SEEN.m[a]-SEEN.m[b]).slice(0, keys.length-3000).forEach(k=>delete SEEN.m[k]); }
  LS.set("nx_seen", SEEN.m); LS.set("nx_tick", SEEN.t);
}
function freshOrder(arr){
  const jit = Math.max(4, arr.length/3);
  return arr.map(q=>{ const t=SEEN.m[qKey(q)]; return {q, w: t ? t + Math.random()*jit : -1 - Math.random()*1000}; }).sort((a,b)=>a.w-b.w).map(x=>x.q);
}
/* Guruhlarni navbatma-navbat aralashtirish: har mavzudan (yoki fandan) bittadan */
function interleave(groups){
  const qs = shuffle(groups.filter(g=>g.length)).map(g=>g.slice()), out=[];
  while (qs.some(g=>g.length)) qs.forEach(g=>{ if (g.length) out.push(g.shift()); });
  return out;
}
function byKey(arr, f){ const m=new Map(); arr.forEach(x=>{ const k=f(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); }); return [...m.values()]; }
const lessonSubj = id => (S.lessons.find(l=>l.id===id)||{}).subject || "";
function mixDeck(pool){
  return interleave(byKey(pool, q=>lessonSubj(q.lessonId)).map(sub => interleave(byKey(sub, q=>q.lessonId).map(freshOrder))));
}

/* ================= TEZKOR HISOB: cheksiz matematik misollar ================= */
const RN = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const GEN_KINDS = { karra:"Karra jadvali", bolish:"Bo‘lish", qoshish:"Qo‘shish", ayirish:"Ayirish", nomalum:"Noma’lum son", masala:"Masalalar" };
const genKindsFor = g => +g<=1 ? ["qoshish","ayirish","nomalum","masala"] : Object.keys(GEN_KINDS);
const genLevel = (g, easy) => Math.max(1, Math.min(4, +g - (easy?1:0)));
const NAMES = ["Ali","Malika","Sardor","Zarina","Bobur","Madina","Jasur","Nilufar","Aziz","Laylo"];
const ITEMS = ["olma","nok","qalam","daftar","kitob","konfet","shar","gul","tugma","yong‘oq"];
function tbl(lv){ return lv<=1 ? [2,3] : lv===2 ? [2,5] : [2,9]; }
function addPair(lv){
  if (lv<=1){ const a=RN(1,12), b=RN(1,20-a); return [a,b]; }
  if (lv===2){ const a=RN(10,80), b=RN(2,99-a); return [a,b]; }
  if (lv===3){ if (Math.random()<.5){ const a=RN(1,7)*100+RN(0,9)*10, b=RN(1,9-Math.ceil(a/100))*100+RN(0,9)*10; return [a,b]; } const a=RN(100,850), b=RN(10,999-a); return [a,b]; }
  const a=RN(1000,8500), b=RN(100,9999-a); return [a,b];
}
function mulPair(lv){
  if (lv>=4 && Math.random()<.5) return [RN(11,49), RN(2,9)];
  const [lo,hi]=tbl(lv); return [RN(lo,hi), RN(lv<=1?1:2, lv<=1?5:10)];
}
function genOne(kind, lv){
  let q, a, ex;
  if (kind==="karra"){ const [x,y]=mulPair(lv); a=x*y; q=`${fmt(x)} · ${y} = ?`; ex=`${fmt(x)} · ${y} = ${fmt(a)}`; }
  else if (kind==="bolish"){ let [x,y]=mulPair(lv); if (x>10) [x,y]=[y,x]; const p=x*y; a=y; q=`${fmt(p)} : ${x} = ?`; ex=`${fmt(p)} : ${x} = ${a}, chunki ${x} · ${a} = ${fmt(p)}`; }
  else if (kind==="qoshish"){ const [x,y]=addPair(lv); a=x+y; q=`${fmt(x)} + ${fmt(y)} = ?`; ex=`${fmt(x)} + ${fmt(y)} = ${fmt(a)}`; }
  else if (kind==="ayirish"){ const [x,y]=addPair(lv); const c=x+y; a=x; q=`${fmt(c)} − ${fmt(y)} = ?`; ex=`${fmt(c)} − ${fmt(y)} = ${fmt(a)}`; }
  else if (kind==="nomalum"){
    const useMul = lv>=2 && Math.random()<.4;
    if (useMul){ const [x,y]=mulPair(Math.min(lv,3)); const p=x*y;
      if (Math.random()<.5){ a=y; q=`Noma’lum sonni toping: ${x} · □ = ${fmt(p)}`; ex=`□ = ${fmt(p)} : ${x} = ${y}`; }
      else { a=p; q=`Noma’lum sonni toping: □ : ${x} = ${y}`; ex=`□ = ${y} · ${x} = ${fmt(p)}`; } }
    else { const [x,y]=addPair(lv); const c=x+y, f=RN(0,3);
      if (f===0){ a=x; q=`Noma’lum sonni toping: □ + ${fmt(y)} = ${fmt(c)}`; ex=`□ = ${fmt(c)} − ${fmt(y)} = ${fmt(x)}`; }
      else if (f===1){ a=y; q=`Noma’lum sonni toping: ${fmt(x)} + □ = ${fmt(c)}`; ex=`□ = ${fmt(c)} − ${fmt(x)} = ${fmt(y)}`; }
      else if (f===2){ a=y; q=`Noma’lum sonni toping: ${fmt(c)} − □ = ${fmt(x)}`; ex=`□ = ${fmt(c)} − ${fmt(x)} = ${fmt(y)}`; }
      else { a=c; q=`Noma’lum sonni toping: □ − ${fmt(y)} = ${fmt(x)}`; ex=`□ = ${fmt(x)} + ${fmt(y)} = ${fmt(c)}`; } }
  }
  else { // masala
    const it=pickOne(ITEMS), n1=pickOne(NAMES); let n2=pickOne(NAMES); while(n2===n1) n2=pickOne(NAMES);
    const t = lv>=2 ? RN(0,4) : RN(0,2), small = Math.min(lv,2);
    if (t===0){ const [x,y]=addPair(small); a=x+y; q=`${n1}da ${x} ta ${it} bor edi. Unga yana ${y} ta ${it} berishdi. ${n1}da nechta ${it} bo‘ldi?`; ex=`${x} + ${y} = ${a}`; }
    else if (t===1){ const [x,y]=addPair(small); const c=x+y; a=x; q=`Savatda ${c} ta ${it} bor edi. Ulardan ${y} tasi olindi. Savatda nechta ${it} qoldi?`; ex=`${c} − ${y} = ${a}`; }
    else if (t===2){ let [x,y]=addPair(small); if (x===y) x++; const big=Math.max(x,y), sm=Math.min(x,y); a=big-sm; q=`${n1}da ${big} ta ${it}, ${n2}da ${sm} ta ${it} bor. ${n1}da nechta ${it} ko‘p?`; ex=`${big} − ${sm} = ${a}`; }
    else if (t===3){ const [x,y]=mulPair(Math.min(lv,3)); a=x*y; q=`Bitta qutida ${x} ta ${it} bor. ${y} ta qutida nechta ${it} bor?`; ex=`${x} · ${y} = ${a}`; }
    else { const [x,y]=mulPair(Math.min(lv,3)); const p=x*y; a=y; q=`${p} ta ${it}ni ${x} ta bolaga teng bo‘lishdi. Har bir bolaga nechta ${it} tegdi?`; ex=`${p} : ${x} = ${y}`; }
  }
  const o = { gen:true, kind, type:"input", q, answer:String(a), explain:ex, lessonId:"gen:"+kind };
  if (Math.random() < .35){ // ba'zan variantli
    const step = a>=1000?100 : a>=100?10 : 1, cand = new Set();
    [a+step, a-step, a+1, a-1, a+2*step, a-2, a+10, a-10].forEach(v=>{ if (v>=0 && v!==a && cand.size<3) cand.add(v); });
    o.type="choice"; o.options=[a,...cand].map(String); o.shown=shuffle(o.options);
  }
  return o;
}
function genQs(kinds, n, lv){
  const out=[], seen=new Set(); let guard=0;
  while (out.length<n && guard++<n*20){ const q=genOne(kinds[out.length % kinds.length], lv); if (seen.has(q.q)) continue; seen.add(q.q); out.push(q); }
  return shuffle(out);
}

/* ================= TEST O'YINI ================= */
function prepQ(q, lessonId){
  const o = {...q, lessonId};
  if (q.type !== "input") o.shown = shuffle(q.options || []);
  delete o._seen;
  return o;
}
function startLesson(id){
  const l = S.lessons.find(x=>x.id===id); if (!l) return;
  S.quiz = { title: l.title, sub: `${l.grade}-sinf · ${l.subject}${l.num?" · "+l.num+"-dars":""}`, qs: freshOrder((l.questions||[]).map(q=>prepQ(q,l.id))), i:0, res:[], answered:false, back:"lessons", src:{kind:"lesson", id} };
  go("quiz");
}
function startReview({lessonIds, count, weak, title}){
  const pool = [];
  lessonIds.forEach(id => { const l=S.lessons.find(x=>x.id===id); if(l) (l.questions||[]).forEach(q=>pool.push(prepQ(q,l.id))); });
  if (!pool.length){ toast("Tanlangan mavzularda savol yo‘q"); return; }
  let qs;
  if (weak){
    const cand = freshOrder(pool).slice(0, Math.max(count*3, count));
    qs = cand.map(q=>({q, w:(100-(lessonScore(q.lessonId) ?? 60)) + Math.random()*40})).sort((a,b)=>b.w-a.w).map(x=>x.q);
    qs = shuffle(qs.slice(0,count));
  } else qs = shuffle(mixDeck(pool).slice(0,count));
  S.quiz = { title, sub: `${lessonIds.length} ta mavzu aralash`, qs, i:0, res:[], answered:false, back:"review", src:{kind:"review", lessonIds, count, weak, title} };
  go("quiz");
}
function rQuiz(){
  const Q = S.quiz, el = $("#v-quiz");
  if (!Q){ go("lessons"); return; }
  if (Q.i >= Q.qs.length) return rQuizEnd();
  const q = Q.qs[Q.i], keys="ABCD";
  if (!q._seen){ q._seen=true; markSeen(q); }
  const dots = Q.qs.map((_,k)=>`<i class="${k<Q.res.length?(Q.res[k].ok?"ok":"no"):k===Q.i?"cur":""}"></i>`).join("");
  const body = q.type==="input"
    ? `<form class="ansrow" id="ansForm"><input class="in" id="ansIn" autocomplete="off" placeholder="Javobingizni yozing" aria-label="Javob"><button class="btn" type="submit">Tekshirish</button></form>`
    : `<div class="opts">${q.shown.map((o,k)=>`<button class="opt" type="button" data-o="${esc(o)}"><span class="k">${keys[k]||k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  el.innerHTML = `<div class="quiz">
    <div class="qhead">
      <div><span class="eyebrow">${esc(Q.sub)}</span><h2 style="font-size:22px">${esc(Q.title)}</h2></div>
      <div class="row"><span class="stars num">★ ${S.stars}</span><button class="btn ghost sm" type="button" id="qExit">Chiqish</button></div>
    </div>
    <div class="dots" aria-label="${Q.i+1}-savol, jami ${Q.qs.length}">${dots}</div>
    <div class="sheet ruled qcard" id="qCard">
      <span class="eyebrow num">${Q.i+1} / ${Q.qs.length}-savol</span>
      <div class="qtext">${esc(q.q)}</div>
      ${body}
      <div id="qFb" style="margin-top:14px"></div>
    </div>
    ${sign()}
  </div>`;
  $("#qExit").onclick = () => { S.quiz=null; go(Q.back); };
  if (q.type==="input"){
    const f=$("#ansForm"); $("#ansIn").focus(); if (q.gen) $("#ansIn").setAttribute("inputmode","numeric");
    f.onsubmit = e => { e.preventDefault(); const v=$("#ansIn").value; if(!v.trim()){ $("#ansIn").focus(); return; } judge(v); };
  } else $$("#qCard .opt").forEach(b => b.onclick = () => judge(b.dataset.o, b));
}
function isRight(q, v){
  const ans=[q.answer, ...(q.accept||[])].map(norm);
  return ans.includes(norm(v));
}
function judge(v, btn){
  const Q=S.quiz; if (Q.answered) return; Q.answered=true;
  const q=Q.qs[Q.i], ok=isRight(q,v);
  Q.res.push({ok, q, given:v}); recordAnswer(q.lessonId, ok);
  if (q.type!=="input"){
    $$("#qCard .opt").forEach(b => { b.disabled=true; if (norm(b.dataset.o)===norm(q.answer)) b.classList.add("ok"); });
    if (!ok && btn) btn.classList.add("no");
  } else { $("#ansIn").disabled=true; $("#ansForm button").disabled=true; }
  if (!ok) $("#qCard").classList.add("shake");
  $("#qFb").innerHTML = `<div class="feedback ${ok?"ok":"no"}"><div>${ok?"To‘g‘ri! +1 yulduzcha":"Bu safar xato."}${!ok?` <span style="color:var(--ink)">To‘g‘ri javob: <b>${esc(q.answer)}</b></span>`:""}${q.explain?`<p>${esc(q.explain)}</p>`:""}</div></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" type="button" id="qNext">${Q.i+1<Q.qs.length?"Keyingi savol":"Natijani ko‘rish"}</button></div>`;
  $("#v-quiz .stars").textContent = "★ "+S.stars;
  $("#qNext").focus();
  $("#qNext").onclick = () => { Q.i++; Q.answered=false; rQuiz(); };
}
function rQuizEnd(){
  const Q=S.quiz, right=Q.res.filter(r=>r.ok).length, pct=Math.round(right/Q.res.length*100);
  const wrong=Q.res.filter(r=>!r.ok);
  const verdict = pct>=90?"A’lo natija!":pct>=70?"Yaxshi! Yana ozgina mashq.":pct>=50?"Mavzuni yana bir bor takrorlaylik.":"Mavzuni darslikdan qayta o‘qib chiqing.";
  $("#v-quiz").innerHTML = `<div class="quiz"><div class="sheet result">
    <span class="eyebrow">${esc(Q.title)}</span>
    <div class="score-big num" style="color:${pct>=70?"var(--ok)":pct>=50?"var(--g2)":"var(--bad)"}">${right}/${Q.res.length}</div>
    <h2 style="font-size:24px">${verdict}</h2>
    <p class="muted" style="margin:0">To‘g‘ri javoblar: <b class="num">${pct}%</b> · Jami yulduzcha: <b class="num">${S.stars}</b></p>
    <div class="row" style="justify-content:center">
      ${wrong.length?`<button class="btn sun" type="button" id="rRetry">Xatolarni qayta ishlash (${wrong.length})</button>`:""}
      <button class="btn ghost" type="button" id="rAgain">Yana bir marta</button>
      <button class="btn ghost" type="button" id="rBack">Ortga</button>
    </div>
    ${wrong.length?`<div class="mistakes"><span class="eyebrow">Xato qilingan savollar</span>${wrong.map(r=>`<div class="mistake"><b>${esc(r.q.q)}</b><span class="muted">Javobingiz: ${esc(r.given)} · To‘g‘ri: <b style="color:var(--ok)">${esc(r.q.answer)}</b></span></div>`).join("")}</div>`:""}
  </div>${sign()}</div>`;
  if (wrong.length) $("#rRetry").onclick = () => { S.quiz = {...Q, title:Q.title+" · xatolar ustida ishlash", qs: shuffle(wrong.map(r=>({...prepQ(r.q, r.q.lessonId), _seen:false}))), i:0, res:[], answered:false}; rQuiz(); };
  $("#rAgain").onclick = () => Q.src.kind==="lesson" ? startLesson(Q.src.id) : Q.src.kind==="mix" ? startMix(Q.src) : Q.src.kind==="gen" ? startGen(Q.src) : startReview(Q.src);
  $("#rBack").onclick = () => { S.quiz=null; go(Q.back); };
}

    <div><span class="eyebrow">${S.grade}-sinf</span><h2 style="font-size:26px">Takrorlash</h2><p class="muted" style="margin:4px 0 0;max-width:62ch">Bir nechta mavzuni belgilang. Savollar aralashib keladi, shuning uchun o‘quvchi mavzuni yodlab emas, tushunib javob beradi.</p></div>

        ${L.length?`<div class="lessonpick">${L.map(l=>{const sc=lessonScore(l.id);return `<label class="pick"><input type="checkbox" id="rv-${l.id}" data-id="${l.id}" ${sel.has(l.id)?"checked":""}><span><b>${esc(l.title)}</b><br><small>${esc(l.subject)}${l.num?" · "+l.num+"-dars":""} · ${(l.questions||[]).length} savol</small></span>${sc!==null?`<span class="badge num" style="${sc<60?"color:var(--bad)":""}">${sc}%</span>`:""}</label>`}).join("")}</div>`:`<div class="empty" style="padding:18px">Bu tanlovda savolli mavzu yo‘q.</div>`}
      </div>
      <div class="sheet ruled" style="display:flex;flex-direction:column;gap:14px">
        <span class="eyebrow">3. Sozlamalar</span>
        <div class="row" role="group" aria-label="Savollar soni">${[5,10,15,20].map(n=>`<button class="chip num" type="button" data-n="${n}" aria-pressed="${count===n}">${n} savol</button>`).join("")}</div>
        <div class="row" role="group" aria-label="Rejim">
          <button class="chip" type="button" data-w="0" aria-pressed="${!weak}">Aralash</button>
          <button class="chip" type="button" data-w="1" aria-pressed="${weak}">Qiyin mavzular oldinda</button>
        </div>
        <p class="muted" style="margin:0;font-size:13.5px">“Qiyin mavzular” rejimi shu qurilmadagi natijalarga qaraydi: foizi past mavzulardan ko‘proq savol tushadi.</p>
        <div><b class="num" id="rvInfo"></b></div>
        <button class="btn sun" type="button" id="rvGo">Takrorlashni boshlash</button>
      </div>
    </div>${sign()}`;
  const info = () => { const ids=[...sel].filter(id=>L.some(l=>l.id===id)); const n=ids.reduce((s,id)=>s+(S.lessons.find(l=>l.id===id).questions||[]).length,0); $("#rvInfo").textContent=`${ids.length} ta mavzu · ${n} ta savoldan ${Math.min(count,n)} tasi`; $("#rvGo").disabled=!n; };
  info();
  $$("#v-review [data-s]").forEach(c=>c.onclick=()=>{ S.reviewSubj=c.dataset.s||null; S.reviewSel=null; rReview(); });
  $$("#v-review [data-n]").forEach(c=>c.onclick=()=>{ S.reviewCount=+c.dataset.n; rReview(); });
  $$("#v-review [data-w]").forEach(c=>c.onclick=()=>{ S.reviewWeak=c.dataset.w==="1"; rReview(); });
  $$("#v-review .pick input").forEach(i=>i.onchange=()=>{ i.checked?sel.add(i.dataset.id):sel.delete(i.dataset.id); info(); });
  $("#rvAll").onclick=()=>{ L.forEach(l=>sel.add(l.id)); rReview(); };
  $("#rvNone").onclick=()=>{ sel.clear(); rReview(); };
  $("#rvGo").onclick=()=>{ const ids=[...sel].filter(id=>L.some(l=>l.id===id)); startReview({lessonIds:ids, count, weak, title:`${S.grade}-sinf · ${subj||"aralash"} takrori`}); };

/* ================= ARALASH ================= */
function startGen({kinds, count, easy, title}){
  const lv = genLevel(S.grade, easy);
  S.quiz = { title, sub:`Tezkor hisob · ${easy?"oson":S.grade+"-sinf"} daraja · har safar yangi misollar`, qs: genQs(kinds, count, lv), i:0, res:[], answered:false, back:"mix", src:{kind:"gen", kinds, count, easy, title} };
  go("quiz");
}
function startMix({subjects, gen, count, easy, title}){
  const groups = subjects.map(s => mixDeck(lessonsOf(S.grade, s).flatMap(l=>(l.questions||[]).map(q=>prepQ(q,l.id)))).filter(Boolean)).filter(g=>g.length);
  if (gen) groups.push(genQs(genKindsFor(S.grade), count, genLevel(S.grade, easy)));
  if (!groups.length){ toast("Kamida bitta fanni tanlang"); return; }
  const qs = shuffle(interleave(groups).slice(0, count));
  S.quiz = { title, sub:`${[...subjects, ...(gen?["Tezkor hisob"]:[])].join(" · ")}`, qs, i:0, res:[], answered:false, back:"mix", src:{kind:"mix", subjects, gen, count, easy, title} };
  go("quiz");
}

function startDuel(){
  const c=S.duelCfg; let ls;
  if (c.srcKind==="gen"){
    const k=c.src.slice(4), kinds = k==="all" ? genKindsFor(S.grade) : [k];
    S.duel = { on:true, title:`Tezkor hisob · ${k==="all"?"aralash":GEN_KINDS[k]}`, pool:[], deck:[], gen:{kinds, lv:genLevel(S.grade, c.easy), used:new Set()}, target:c.target,
      players: c.names.slice(0,c.n).map(n=>({name:n, score:0, q:null, lock:false, fb:""})), winner:null };
    S.duel.players.forEach(p=>nextDuelQ(p)); rArena(); return;
  }
  if (c.srcKind==="lesson") ls=S.lessons.filter(l=>l.id===c.src);
  else if (c.srcKind==="subject") ls=lessonsOf(S.grade,c.src);
  else ls=lessonsOf(S.grade);
  const pool=[]; ls.forEach(l=>(l.questions||[]).forEach(q=>pool.push({...q, lessonId:l.id})));
  if (!pool.length){ toast("Bu manbada savol yo‘q"); return; }
  const title = c.srcKind==="lesson" ? ls[0].title : c.srcKind==="subject" ? c.src+" takrori" : `${S.grade}-sinf aralash`;
  S.duel = { on:true, title, pool, deck:mixDeck(pool), target:c.target, players: c.names.slice(0,c.n).map(n=>({name:n, score:0, q:null, lock:false, fb:""})), winner:null };
  S.duel.players.forEach(p=>nextDuelQ(p));
  rArena();
}
/* Umumiy koloda: bir duelda ikki o'quvchiga bir xil savol tushmaydi */
function nextDuelQ(p){
  const D=S.duel; let q;
  if (D.gen){ let g=0; do { q=genOne(pickOne(D.gen.kinds), D.gen.lv); } while (D.gen.used.has(q.q) && g++<30); D.gen.used.add(q.q); }
  else {
    const onScreen = new Set(D.players.filter(x=>x!==p && x.q).map(x=>x.q.q));
    if (!D.deck.length) D.deck = mixDeck(D.pool);
    let k = D.deck.findIndex(x=>!onScreen.has(x.q)); if (k<0) k=0;
    q = D.deck.splice(k,1)[0]; markSeen(q);
  }
  p.q={...q, shown: q.type==="input"?null:shuffle(q.options||[])}; p.lock=false; p.typed="";
}
/* Har bir o'quvchining o'z tugmalari: bir vaqtda bosish (multi-touch) va klaviatura zonalari */
const DUEL_KEYS=[["1","2","3","4"],["7","8","9","0"],["V","B","N","M"]];
const ABC=["a","b","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","x","y","z","o‘","g‘","-","␣"];
const isNumQ = q => /^\d+$/.test(String(q.answer).trim());
function kpadHTML(i,q){
  const keys = isNumQ(q) ? ["1","2","3","4","5","6","7","8","9","⌫","0","OK"] : [...ABC,"⌫","OK"];
  return `<div class="kpad ${isNumQ(q)?"knum":"kabc"}" data-kp="${i}">${keys.map(k=>`<button type="button" class="kk ${k==="OK"?"kok":k==="⌫"?"kdel":""}" data-k="${k}" aria-label="${k==="␣"?"bo‘sh joy":k==="⌫"?"o‘chirish":k}">${k}</button>`).join("")}</div>`;
}
function boxHTML(i){
  const D=S.duel, p=D.players[i], q=p.q, keys=DUEL_KEYS[i];
  const body = q.type==="input"
    ? `<div class="adisp" id="dIn${i}" aria-live="polite">${p.typed?esc(p.typed):`<span class="ph">Javobni tugmalar bilan yozing</span>`}</div>${p.lock?"":kpadHTML(i,q)}`
    : `<div class="opts" style="grid-template-columns:1fr 1fr">${q.shown.map((o,k)=>`<button class="opt" type="button" data-p="${i}" data-o="${esc(o)}" ${p.lock?"disabled":""}><span class="k">${keys[k]||k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  return `<div class="pbox pc${i+1}" id="pb${i}"><div class="pn"><span>${esc(p.name)}</span><span class="num">${p.score}/${D.target}</span></div><div class="pq">${esc(q.q)}</div>${body}<div class="status" id="pf${i}" style="min-height:20px;color:var(--chalk)">${esc(p.fb)}</div></div>`;
}
function bindBox(i){
  const box=$("#pb"+i); if(!box) return;
  $$(".opt",box).forEach(b=>{
    b.addEventListener("pointerup", e=>{ e.preventDefault(); duelAnswer(i, b.dataset.o, b); });
    b.addEventListener("click", e=>{ if(e.detail===0) duelAnswer(i, b.dataset.o, b); });
  });
  const kp=$(".kpad",box);
  if (kp) $$(".kk",kp).forEach(b=>{
    b.addEventListener("pointerdown", e=>{ e.preventDefault(); b._pd=Date.now(); b.classList.add("down"); duelKey(i, b.dataset.k); });
    const up=()=>b.classList.remove("down");
    b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
    b.addEventListener("click", e=>{ if(!b._pd || Date.now()-b._pd>700) duelKey(i, b.dataset.k); });
  });
}
function renderBox(i){ const old=$("#pb"+i); if(!old) return; old.outerHTML=boxHTML(i); bindBox(i); }
function renderTrack(){
  const D=S.duel, t=$("#v-duel .track"); if(!t) return;
  t.innerHTML = D.players.map((p,i)=>`<div class="lane"><b class="pc${i+1}" style="color:var(--pc)">${esc(p.name)}</b><div class="road"><i class="pc${i+1}" style="width:${p.score/D.target*100}%"></i></div><b class="num" style="text-align:right">${p.score}</b></div>`).join("");
}
function duelKey(i,k){
  const D=S.duel, p=D&&D.players[i]; if(!p||p.lock||D.winner) return;
  if (k==="OK"){ if(p.typed.trim()) duelAnswer(i, p.typed); return; }
  if (k==="⌫") p.typed=p.typed.slice(0,-1);
  else if (p.typed.length<24) p.typed += (k==="␣"?" ":k);
  const d=$("#dIn"+i); if(d) d.innerHTML = p.typed?esc(p.typed):`<span class="ph">Javobni tugmalar bilan yozing</span>`;
}

document.addEventListener("keydown", e=>{
  const D=S.duel; if(!D||!D.on||D.winner||$("#v-duel").hidden) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  const key=e.key.length===1?e.key.toUpperCase():e.key;
  D.players.forEach((p,i)=>{
    const k=DUEL_KEYS[i].indexOf(key); if(k<0||p.q.type==="input"||p.lock) return;
    const btn=$$("#pb"+i+" .opt")[k]; if(btn){ e.preventDefault(); duelAnswer(i, btn.dataset.o, btn); }
  });
});
function duelAnswer(i, v, btn){
  const D=S.duel, p=D.players[i]; if (p.lock||D.winner) return; p.lock=true;
  const ok=isRight(p.q, v); recordAnswer(p.q.lessonId, ok);
  if (ok){ p.score++; p.fb="To‘g‘ri! Bir qadam oldinga."; } else p.fb=`Xato. To‘g‘ri javob: ${p.q.answer}`;
  renderBox(i); renderTrack();
  const box=$("#pb"+i);
  $$(".opt",box).forEach(b=>{ if(norm(b.dataset.o)===norm(p.q.answer)) b.classList.add("ok"); if(!ok && b.dataset.o===v) b.classList.add("no"); });
  const d=$("#dIn"+i); if(d) d.classList.add(ok?"ok":"no");
  if (!ok) box.classList.add("shake");
  if (p.score>=D.target){ D.winner=p.name; confetti(); setTimeout(rArena, 500); return; }
  setTimeout(()=>{ if(S.duel!==D||D.winner) return; nextDuelQ(p); p.fb=""; renderBox(i); }, ok?900:1700);
}
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("div"); c.className="confetti";
  const cols=["#F07A6A","#73A2E6","#F2CF5B","#55C487","#E0674F"];
  for(let k=0;k<70;k++){ const i=document.createElement("i"); i.style.left=Math.random()*100+"%"; i.style.background=cols[k%cols.length]; i.style.animationDelay=(Math.random()*.8)+"s"; c.appendChild(i); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),3600);
}

let pdfReady=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
function pdfLib(){
  if (!pdfReady) pdfReady = (async()=>{
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base+"pdf.worker.min.js");
    await loadScript(base+"pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js";
    return window.pdfjsLib;
  })().catch(e=>{ pdfReady=null; throw e; });
  return pdfReady;
}
function bookUrl(b){ return localFiles[b.id] || b.url || (b.assetId ? "/_blob/"+b.assetId : null); }
const pdfCache = {};
async function getPdf(b){

}

    <input class="in" data-k="explain" value="${esc(q.explain||"")}" placeholder="Izoh: o‘quvchiga javobdan keyin ko‘rsatiladi (ixtiyoriy)" aria-label="Izoh">
  </div>`).join("") : `<div class="empty" style="padding:18px">Savol yo‘q. Avtomatik tuzing yoki qo‘lda qo‘shing.</div>`;
  $$("[data-rm]",box).forEach(b=>b.onclick=()=>{ pullQs(); d.questions.splice(+b.dataset.rm,1); renderQList(); });
  $$("[data-up]",box).forEach(b=>b.onclick=()=>{ pullQs(); const i=+b.dataset.up; [d.questions[i-1],d.questions[i]]=[d.questions[i],d.questions[i-1]]; renderQList(); });

function pullQs(){
  const d=S.draft;
  $$("#qList .qedit").forEach(el=>{
    const q=d.questions[+el.dataset.qi]; if(!q) return;
    q.q=$('[data-k="q"]',el).value; q.explain=$('[data-k="explain"]',el).value.trim();
    if (q.type==="input"){ q.answer=$('[data-k="answer"]',el).value.trim(); q.accept=$('[data-k="accept"]',el).value.split(",").map(s=>s.trim()).filter(Boolean); }
    else { q.options=$$("[data-opt]",el).map(i=>i.value.trim()); const r=$("[data-ok]:checked",el); q.answer = r ? q.options[+r.dataset.ok] : ""; }
  });
}
async function pdfPagesText(b, from, to){
  const doc=await getPdf(b); from=Math.max(1,from); to=Math.min(doc.numPages, Math.max(from,to||from)); if(to-from>7) to=from+7;
  let text=""; for(let p=from;p<=to;p++){ const pg=await doc.getPage(p); const tc=await pg.getTextContent(); text+=`\n[${p}-bet]\n`+tc.items.map(i=>i.str).join(" "); }
  return {text:text.trim(), doc, from, to};
}
async function pdfPagesImages(doc, from, to, max){
  const out=[]; for(let p=from;p<=to && out.length<max;p++){ const pg=await doc.getPage(p); const vp0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:1400/vp0.width}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; out.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.82))); }
  return out;
}
async function aiGenerate(){
  const d=S.draft, st=$("#aiSt"), btn=$("#aiGo");
  const set=(m,c="")=>{ st.className="status "+c; st.textContent=m; };
  if (!sample){ set("Avtomatik tuzish faqat claude.ai ichida ochilganda ishlaydi. Savollarni qo‘lda qo‘shishingiz mumkin.","err"); return; }
  if (!d.title){ set("Avval mavzu nomini yozing.","err"); return; }
  const src=$("#aiSrc").value, n=+$("#aiN").value, mix=$("#aiMix").value;
  let material="", images=[];
  btn.disabled=true;
  try{
    if (src==="pdf"){
      const b=S.books.find(x=>x.id===d.bookId);
      if (!b || !d.pageFrom){ set("Darslikni tanlang va bet raqamini kiriting.","err"); return; }
      set("Darslik betlari o‘qilmoqda…");
      const r=await pdfPagesText(b, +d.pageFrom, +d.pageTo||+d.pageFrom);
      material=r.text;
      if (material.replace(/\[\d+-bet\]|\s/g,"").length < 120){
        const lim=await sample.limits().catch(()=>({}));
        if (lim.images){ set("Betlar rasm ko‘rinishida, rasmlar tahlil qilinmoqda…"); images=await pdfPagesImages(r.doc, r.from, r.to, Math.min(lim.images.maxCount||3,4)); material=""; }
        else { set("Bu betlardan matn olinmadi (skanerlangan). Mazmunni matn maydoniga yozing.","err"); return; }
      }
    } else {
      material=d.summary;
      if (material.length<20){ set("Mazmun maydoniga mavzu qoidasi yoki matnini yozing (kamida bir-ikki gap).","err"); return; }
    }
    set("Savollar tuzilmoqda…");
    const types = mix==="choice"?`Hammasi "choice" turida bo‘lsin.`:mix==="input"?`Hammasi "input" turida bo‘lsin (javob 1–3 so‘z yoki son).`:`Taxminan 70% "choice", 30% "input" (javob 1–3 so‘z yoki son).`;
    const prompt = `Siz O‘zbekistondagi tajribali boshlang‘ich sinf o‘qituvchisisiz.
${d.grade}-sinf "${d.subject}" fani, "${d.title}" mavzusi bo‘yicha o‘quvchi bilimini mustahkamlash uchun ${n} ta savol tuzing.
Qoidalar:
- Faqat berilgan material va shu mavzu doirasida. Materialda bo‘lmagan faktlarni qo‘shmang.
- O‘zbek tilida, lotin yozuvida (oʻ, gʻ, tutuq belgisi ’). ${d.grade}-sinf bolasi tushunadigan qisqa gaplar.
- Savollar xilma-xil bo‘lsin: tushunish, qo‘llash, misol topish. Bir xil savolni takrorlamang.
- ${types}
- "choice": aynan 4 ta variant, bittasi to‘g‘ri; "answer" variantlardan biri bilan harfma-harf bir xil. Noto‘g‘ri variantlar ishonarli bo‘lsin.
- "input": "answer" qisqa; "accept" ichida boshqa to‘g‘ri yozilish shakllari (bo‘lsa).
- Har bir savolga 1 gaplik "explain" — nima uchun shu javob to‘g‘ri.
- Matematikada har bir hisobni tekshirib chiqing.
- Diniy mavzular ishlatilmasin.
Faqat JSON qaytaring: {"questions":[{"type":"choice","q":"...","options":["...","...","...","..."],"answer":"...","explain":"..."},{"type":"input","q":"...","answer":"...","accept":["..."],"explain":"..."}]}
${material?`\nMaterial:\n"""\n${material.slice(0,12000)}\n"""`:"\nMaterial: ilova qilingan darslik betlari rasmlari."}`;
    const out = await sample.json(prompt, {modelTier:"default", cache:false, ...(images.length?{images}:{})});
    const qs = (out && Array.isArray(out.questions) ? out.questions : []).map(q=>{
      if (q.type==="input") return {type:"input", q:String(q.q||""), answer:String(q.answer||""), accept:Array.isArray(q.accept)?q.accept.map(String):[], explain:String(q.explain||"")};
      const opts=(q.options||[]).map(String).slice(0,4); const ans=String(q.answer||"");
      return opts.map(norm).includes(norm(ans)) ? {type:"choice", q:String(q.q||""), options:opts, answer:opts.find(o=>norm(o)===norm(ans)), explain:String(q.explain||"")} : null;
    }).filter(q=>q && q.q && q.answer);
    if (!qs.length){ set("Savol tuzilmadi. Mazmunni to‘liqroq yozib, qayta urinib ko‘ring.","err"); return; }
    d.questions.push(...qs); renderQList();
    set(`${qs.length} ta savol qo‘shildi. Tekshirib chiqing va “Saqlash”ni bosing.`,"ok");
  }catch(e){
    const m={not_granted:"Ruxsat berilmadi.",rate_limited:"Juda ko‘p so‘rov. Bir daqiqadan so‘ng urinib ko‘ring.",prompt_too_large:"Material juda katta. Kamroq bet tanlang.",invalid_json:"Javob noto‘g‘ri formatda keldi, qayta urinib ko‘ring.",nofile:"Darslik fayli topilmadi."};
    set(m[e?.code]||m[e?.message]||"Xatolik: "+(e?.message||"qayta urinib ko‘ring"),"err");
  }finally{ btn.disabled=false; }
}

    try{
      let pages=null; set("Fayl tekshirilmoqda…");
      try{ const lib=await pdfLib(); const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise; pages=doc.numPages; }catch{ set("PDF faylni o‘qib bo‘lmadi.","err"); btn.disabled=false; return; }
      const obj={id:uid(), grade:+$("#bGrade").value, subject:$("#bSubj").value, title, pages, createdAt:new Date().toISOString()};
      if (assets){ set("Yuklanmoqda…"); const up=await assets.upload(f,{type:"application/pdf"}); obj.assetId=up.id; obj.url=up.url; }
      else localFiles[obj.id]=URL.createObjectURL(f);
      await saveBook(obj); set("Yuklandi","ok"); toast("Darslik qo‘shildi: "+title); $("#bTitle").value=""; $("#bFile").value="";
    }catch(err){ set("Yuklanmadi: "+({too_large:"fayl juda katta",quota_or_state:"joy tugagan",not_uploader:"yuklash huquqi yo‘q",not_granted:"ruxsat berilmadi"}[err.code]||err.message||"xatolik"),"err"); }
    finally{ btn.disabled=false; }
  };
}

/* ================= Ishga tushirish ================= */
$$(".gchip").forEach(c=>{ c.setAttribute("aria-pressed", String(+c.dataset.g===S.grade)); c.onclick=()=>setGrade(c.dataset.g); });
$$(".tab").forEach(t=>t.onclick=()=>{ if(t.dataset.view==="books") S.reader=null; if(t.dataset.view==="duel"&&S.duel&&S.duel.winner) S.duel=null; go(t.dataset.view); });
$("#brandBtn").onclick=()=>go("home");
go("home");

S.lessons = (window.NX_DATA && window.NX_DATA.lessons) || []; S.loaded = true; S.online = false; renderAll();
// Teacher list refresh without wiping the open form
function refreshTList(){
  const box=$("#tBody .tlist"); if(!box) return;
  const L=lessonsOf(S.grade);
  box.innerHTML = L.length?L.map(l=>`<button class="titem" type="button" data-e="${l.id}" aria-current="${S.editId===l.id}"><b>${esc(l.title||"Nomsiz mavzu")}</b><small>${esc(l.subject)}${l.num?" · "+l.num+"-dars":""} · ${(l.questions||[]).length} savol${l.sample?" · namuna":""}</small></button>`).join(""):`<p class="muted" style="margin:6px">${S.grade}-sinfda mavzu yo‘q.</p>`;
  $$("[data-e]",box).forEach(b=>b.onclick=()=>{ const l=S.lessons.find(x=>x.id===b.dataset.e); S.draft=JSON.parse(JSON.stringify(l)); S.editId=l.id; rTLessons(); });
}
})();
